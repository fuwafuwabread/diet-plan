<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生活インフラ｜食事 × 買い物</title>

<style>
body{
  margin:0;
  padding:20px;
  font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP";
  background:#0b1020;
  color:#e9ecf5;
}
h1{font-size:22px;margin-bottom:10px}
h2{font-size:18px;margin:22px 0 8px}
.card{
  background:#111a33;
  border-radius:14px;
  padding:14px;
  margin-bottom:16px;
}
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  padding:10px;
  border-bottom:1px solid rgba(255,255,255,.1);
}
th{color:#aab3d6}
input[type=checkbox]{transform:scale(1.2);margin-right:6px}
.menu{color:#d7ccff;font-size:13px}
.cheat{color:#ffb020;font-size:13px}
.muted{color:#aab3d6;font-size:13px}
.item{display:flex;gap:8px;align-items:center;margin:6px 0}
select{
  background:#0b1020;
  color:#e9ecf5;
  border:1px solid #333;
  border-radius:10px;
  padding:6px 10px;
}
</style>
</head>

<body>

<h1>生活インフラ｜食事 × 買い物</h1>

<!-- ローテ切替 -->
<div class="card">
<b>ローテ切替</b><br>
<select id="rotationSelect">
  <option value="1">第1ローテ</option>
  <option value="2">第2ローテ</option>
  <option value="3">第3ローテ</option>
</select>
</div>

<!-- 毎食チェック -->
<h2>① 毎食チェック</h2>
<div class="card">
<table id="mealTable">
<tr><th>曜日</th><th>昼</th><th>夜</th></tr>
</table>
</div>

<!-- 買い物 -->
<h2>② 必要な買い物</h2>
<div class="card" id="shopping"><div class="muted">チェックされた食事から自動生成</div></div>

<!-- 凡例 -->
<h2>③ メニュー凡例</h2>
<div class="card muted" id="legend"></div>

<script>
/* ===== データ定義 ===== */

const rotations = {
  1:{
    name:"第1ローテ",
    menus:{
      A:{name:"魚定食",items:["米","鮭","サラダ","味噌"],desc:"ごはん100–150g＋焼き魚＋袋サラダ＋みそ汁"},
      B:{name:"そば温玉",items:["そば","卵","わかめ"],desc:"そば＋温玉＋わかめ/オクラ"},
      C:{name:"卵納豆",items:["卵","納豆","米"],desc:"卵2個＋納豆＋ごはん100g"},
      D:{name:"鍋",items:["豚肉","白菜","きのこ","豆腐"],desc:"豚or鶏＋野菜＋豆腐"},
      E:{name:"鶏もやし",items:["鶏肉","もやし"],desc:"鶏焼き＋もやし炒め"},
      F:{name:"冷奴ツナ",items:["豆腐","ツナ","キムチ"],desc:"豆腐＋ツナorキムチ＋温玉"}
    }
  },
  2:{
    name:"第2ローテ",
    menus:{
      A:{name:"サバ缶定食",items:["米","サバ缶","サラダ","味噌"],desc:"ごはん＋サバ缶＋サラダ"},
      B:{name:"冷やしうどん鶏",items:["うどん","鶏肉","卵","わかめ"],desc:"うどん＋蒸し鶏＋温玉"},
      C:{name:"卵トースト",items:["パン","卵","サラダ"],desc:"トースト＋卵2個＋サラダ"},
      D:{name:"湯豆腐",items:["豆腐","白菜","きのこ"],desc:"湯豆腐＋野菜"},
      E:{name:"豚しゃぶサラダ",items:["豚肉","サラダ"],desc:"豚しゃぶ＋サラダ"},
      F:{name:"納豆豆腐",items:["豆腐","納豆","キムチ"],desc:"豆腐＋納豆＋キムチ"}
    }
  },
  3:{
    name:"第3ローテ",
    menus:{
      A:{name:"ツナ卵サンド",items:["パン","ツナ","卵","サラダ"],desc:"パン＋ツナ卵＋サラダ"},
      B:{name:"簡易炒飯ボウル",items:["米","卵","ミックス野菜"],desc:"ごはん＋卵＋野菜"},
      C:{name:"サラダチキン丼",items:["米","鶏肉","卵","海苔"],desc:"ごはん＋サラダチキン"},
      D:{name:"刺身定食",items:["刺身","サラダ","味噌"],desc:"刺身＋野菜＋みそ汁"},
      E:{name:"麻婆豆腐",items:["豆腐","ひき肉","ニラ"],desc:"麻婆豆腐（主食なし）"},
      F:{name:"豚キムチ",items:["豚肉","キャベツ","キムチ"],desc:"豚＋キャベツ多め"}
    }
  }
};

const weekPlan = {
  mon:["A","D"], tue:["B","E"], wed:["C",null],
  thu:["A","D"], fri:["B","E"], sat:["C",null], sun:["A","F"]
};

/* ===== 状態 ===== */
const state = JSON.parse(localStorage.getItem("meal_state")||"{}");
let rotation = localStorage.getItem("rotation")||"1";

/* ===== 初期化 ===== */
const select=document.getElementById("rotationSelect");
select.value=rotation;
select.onchange=()=>{
  rotation=select.value;
  localStorage.setItem("rotation",rotation);
  render();
};

function render(){
  const table=document.getElementById("mealTable");
  table.innerHTML="<tr><th>曜日</th><th>昼</th><th>夜</th></tr>";
  const menus=rotations[rotation].menus;

  Object.entries(weekPlan).forEach(([day,[lunch,dinner]])=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${day}</td>
      <td>${lunch?`<label><input type="checkbox" data-key="${day}_lunch"> <span class="menu">${menus[lunch].name}</span></label>`:""}</td>
      <td>${dinner?`<label><input type="checkbox" data-key="${day}_dinner"> <span class="menu">${menus[dinner].name}</span></label>`:`<span class="cheat">チート</span>`}</td>
    `;
    table.appendChild(tr);
  });

  document.querySelectorAll("input[type=checkbox]").forEach(cb=>{
    cb.checked=state[cb.dataset.key]||false;
    cb.onchange=()=>{
      state[cb.dataset.key]=cb.checked;
      localStorage.setItem("meal_state",JSON.stringify(state));
      renderShopping();
    };
  });

  renderLegend();
  renderShopping();
}

function renderLegend(){
  const el=document.getElementById("legend");
  el.innerHTML="";
  Object.values(rotations[rotation].menus).forEach(m=>{
    el.innerHTML+=`<b>${m.name}</b>：${m.desc}<br>`;
  });
}

function renderShopping(){
  const el=document.getElementById("shopping");
  const set=new Set();
  const menus=rotations[rotation].menus;

  Object.entries(state).forEach(([k,v])=>{
    if(v){
      const [day,time]=k.split("_");
      const code=weekPlan[day]?.[time==="lunch"?0:1];
      if(code && menus[code]){
        menus[code].items.forEach(i=>set.add(i));
      }
    }
  });

  el.innerHTML="";
  if(set.size===0){
    el.innerHTML="<div class='muted'>まだチェックされていません</div>";
    return;
  }
  set.forEach(i=>{
    el.innerHTML+=`<div class="item"><input type="checkbox"> ${i}</div>`;
  });
}

render();
</script>

</body>
</html>
